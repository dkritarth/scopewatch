name: Media verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify committed media and source provenance
        run: node scripts/media/verify.mjs
      - name: Test media verifier regressions
        run: node --test scripts/media/verify.test.mjs
