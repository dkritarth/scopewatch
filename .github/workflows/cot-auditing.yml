name: CoT auditing tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: poc/cot-auditing/requirements.txt
      - run: python -m pip install -r poc/cot-auditing/requirements.txt
      - run: python -m pytest poc/cot-auditing -q
      - run: python -m compileall -q poc/cot-auditing/src poc/cot-auditing/scripts
