# Scopewatch hosted-demo stack (issue #42).
#
# Traffic path: internet -> caddy (TLS) -> gateway (demo token, caps,
# daily request budgets and per-profile token metering) -> SQLite/workspaces.
#
# The gateway publishes no ports and has no Docker socket or Docker CLI.
# Caddy is its only public ingress. The optional executor-runner fragment
# isolates the socket on a separate network; local execution is the default.
# Secrets arrive via VM env files, never through images or committed files.
# Run ONE gateway replica: request counters live in memory and reset on restart.

name: scopewatch-demo

services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: scopewatch-gateway:42
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      # Required even when the rest of the gateway uses native defaults:
      # without a token, native guards intentionally enter local-dev mode.
      DEMO_TOKEN: ${DEMO_TOKEN:?Set DEMO_TOKEN in the VM env file (see deploy/.env.example).}
      # Shell overrides must reach the gateway, including throwaway smoke
      # checks. Malformed values pass through for native fail-closed parsing.
      DEMO_MAX_CONCURRENT_RUNS: ${DEMO_MAX_CONCURRENT_RUNS:-5}
      DEMO_MAX_TURNS_PER_RUN: ${DEMO_MAX_TURNS_PER_RUN:-40}
      DEMO_RATE_LIMIT_RUNS_PER_MIN_PER_IP: ${DEMO_RATE_LIMIT_RUNS_PER_MIN_PER_IP:-${DEMO_RATE_LIMIT_PER_MIN:-6}}
      DEMO_MAX_RUNS_PER_DAY: ${DEMO_MAX_RUNS_PER_DAY:-${DEMO_DAILY_RUN_BUDGET:-200}}
      DEMO_MAX_ACTIONS_PER_DAY: ${DEMO_MAX_ACTIONS_PER_DAY:-${DEMO_DAILY_ACTION_BUDGET:-5000}}
      # NOT pinned any more (issue #202): it used to be the literal `local`,
      # which `environment:` applies over `env_file:`, so setting
      # SCOPEWATCH_EXECUTOR=remote in the VM .env did nothing and the sidecar
      # fragment was dead configuration. It is now an operator choice with the
      # same default: `local` (no Docker socket anywhere, execution in-process
      # in the gateway), overridable to `docker` or `remote`.
      #
      # `remote` requires the executor-runner fragment
      # (deploy/executor-runner/compose.executor-runner.yaml) merged into this
      # project: the runner alone mounts the Docker socket, and the gateway
      # reaches it at EXECUTOR_RUNNER_URL on the runner-only network below.
      # Merging that fragment does NOT cut the gateway's model-provider egress:
      # the runner gets its own `internal: true` network, and `internal` stays
      # routable (see the note under `networks:`).
      SCOPEWATCH_EXECUTOR: ${SCOPEWATCH_EXECUTOR:-local}
      # Only used by SCOPEWATCH_EXECUTOR=remote; resolved on the internal
      # runner network, never published to the host.
      EXECUTOR_RUNNER_URL: ${EXECUTOR_RUNNER_URL:-http://executor-runner:8091}
      # Scripted seed at first start makes no model calls (see
      # deploy/docker-entrypoint.sh). Live agent/auditor profiles are
      # selected here and need their keys in the VM env file.
      SCOPEWATCH_AGENT_PROFILE: ${SCOPEWATCH_AGENT_PROFILE:-mock}
      SCOPEWATCH_AUDITOR_PROFILE: ${SCOPEWATCH_AUDITOR_PROFILE:-mock}
      SCOPEWATCH_PROVIDERS_CONFIG: /app/backend/config/providers.toml
      SCOPEWATCH_APPROVAL_TTL: ${SCOPEWATCH_APPROVAL_TTL:-300}
      # Per-run workspace root (#117). Every run gets its own copy of the
      # fixture here. Two rules, both enforced by tests in
      # backend/tests/test_run_workspaces_deployment.py:
      #  1. It MUST be a mounted, writable path. This service runs
      #     `read_only: true` with volumes for /data, /workspace and /runs
      #     only, so any other path can neither exist nor be created — and
      #     `docker-entrypoint.sh` seeds with `set -euo pipefail`, so an
      #     unwritable root aborts the container on first start and then makes
      #     every create_run 503.
      #  2. It MUST be the same path the executor-runner mounts, because the
      #     gateway announces `run_workspace` as a bare key under this root
      #     and the runner resolves it under EXECUTOR_RUNNER_WORKSPACE.
      # Deliberately NOT under /workspace: that volume is the copy SOURCE, and
      # run workspaces nested in it would be copied into every later run.
      # Not an operator knob: see deploy/.env.example.
      SCOPEWATCH_RUN_WORKSPACES_DIR: /runs
    volumes:
      # SQLite evidence database. Named volume so `down` keeps demo state
      # and `down -v` fully resets it (runbook "Reset demo data").
      - scopewatch-data:/data
      # Synthetic agent workspace ONLY. Never mount the repo, the home
      # directory, or anything containing keys here.
      #
      # Deliberately NOT `:ro` yet, and the blocker is NOT #173: a run
      # workspace's mode is set by workspaces.py rather than inherited from this
      # volume, so a read-only baseline no longer breaks create_run. What still
      # blocks `:ro` is that /workspace is EMPTY in the image and
      # docker-entrypoint.sh -> scripts/seed_demo.py::seed_workspace_files()
      # creates every scenario file in it on first start. Under `:ro` those
      # writes fail EROFS and `set -euo pipefail` aborts the container. Bake
      # the fixture into the image first. See deploy/RUNBOOK.md
      # "May the scenario fixture be mounted read-only?".
      - scopewatch-workspace:/workspace
      # Per-run workspace copies (#117). Separate from /workspace so the
      # fixture stays pristine, and shared with executor-runner so the remote
      # backend can resolve the announced run_workspace key.
      - scopewatch-run-workspaces:/runs
    networks:
      - internal
      # Runner-only network (issue #202). The executor-runner sidecar attaches
      # here too, and the fragment marks the network `internal: true` (no
      # egress) — which it could not do to `internal`, because the gateway
      # needs that one routable for provider calls. Declared in the base file
      # so this service stays valid with or without the fragment merged.
      - executor-runner
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    # No added capabilities: the gateway listens on 8000 and writes only to
    # /data, /workspace and /runs (owned by its uid from the image build).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c",
             "import sys,urllib.request,json;d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=4));sys.exit(0 if d.get('status')=='ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      # Host ports are parameterised so a SECOND project on the same VM (the
      # throwaway budget-check stack in RUNBOOK section 4) can override them.
      # The defaults are the live values, so the shipped stack is unchanged.
      - "${HTTP_HOST_PORT:-80}:80"
      - "${HTTPS_HOST_PORT:-443}:443"
      - "${HTTPS_HOST_PORT:-443}:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in the VM env file (see deploy/.env.example).}
    networks:
      - public
      - internal
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    # Upstream caddy image defaults are kept (it binds 80/443 itself);
    # only no-new-privileges is added. No mounts except the read-only
    # Caddyfile and its own cert/state volumes.
    security_opt:
      - no-new-privileges:true

# Resource names are project-scoped on purpose (issue #201). Compose scopes
# resources to the project name only when the name is NOT fixed here; a fixed
# top-level `name:` is shared by EVERY project on the host, which made the
# runbook's throwaway budget-check stack (`-p budgetcheck`) mount the live
# SQLite volume, collide on the live networks, and lose 80/443 to the
# live listeners. `${COMPOSE_PROJECT_NAME:-scopewatch-demo}` keeps the shipped
# names byte-identical for the live stack and gives any second project its own.
networks:
  public:
    name: ${COMPOSE_PROJECT_NAME:-scopewatch-demo}-public
  internal:
    name: ${COMPOSE_PROJECT_NAME:-scopewatch-demo}-internal
    # NOTE: this network is NOT marked `internal: true` on purpose: the
    # gateway needs HTTPS egress to the configured model provider
    # (Nebius/OpenRouter) for live agent/auditor calls. Inbound reachability
    # is still least-privilege: only caddy publishes host ports, and the
    # gateway accepts public traffic only through Caddy on the same network.
    #
    # The executor-runner fragment used to redeclare THIS network with
    # `internal: true`, which silently removed the gateway's egress and made
    # every live audit fail closed to HOLD (issue #202). The runner now has
    # its own egress-less network below, and this one is left alone.
  # Runner-only: the gateway and the executor-runner sidecar, nothing else.
  # The merged fragment marks it `internal: true`, so the socket-holding
  # container has no route out; the gateway keeps `internal` for egress.
  # Not attached to Caddy. The name is derived from the project
  # rather than pinned, so a second project (see RUNBOOK's throwaway
  # budget-check stack) cannot collide with the live one.
  executor-runner: {}

volumes:
  scopewatch-data:
    name: ${COMPOSE_PROJECT_NAME:-scopewatch-demo}-data
  scopewatch-workspace:
    name: ${COMPOSE_PROJECT_NAME:-scopewatch-demo}-workspace
  # Per-run workspace copies (#117). Named so `down -v` reclaims them with the
  # rest of the demo state: nothing prunes per-run workspaces yet (#166).
  scopewatch-run-workspaces:
    name: ${COMPOSE_PROJECT_NAME:-scopewatch-demo}-run-workspaces
  caddy-data:
    name: ${COMPOSE_PROJECT_NAME:-scopewatch-demo}-caddy-data
  caddy-config:
    name: ${COMPOSE_PROJECT_NAME:-scopewatch-demo}-caddy-config
