# Compose fragment: executor-runner sidecar (issue #78).
#
# Merge into the deployment alongside the gateway service from the #42
# bundle (deploy/compose.yaml). This is the ONLY service that mounts the
# Docker socket. The gateway, gate, and caddy services MUST NOT mount it
# (enforced by the socket-grep test in backend/tests/test_executor_remote.py).
#
# Required secret (environment only, never committed):
#   EXECUTOR_RUNNER_TOKEN — pre-shared bearer token, shared with the gateway
#   via EXECUTOR_RUNNER_TOKEN in the gateway environment.
#   EXECUTOR_RUNNER_SIGNING_KEY — separate gateway/runner HMAC key. Never use
#   the bearer token as this key.
#
# Internal networking only: no `ports:` published to the host. The gateway
# reaches the runner at http://executor-runner:8091 on the runner-only
# `executor-runner` network, which is `internal: true` (no route off the host).
# The socket mount may alternatively point at a rootless daemon
# socket (e.g. /run/user/1000/docker.sock) — the only change is the source
# path below.
#
# Shared storage contract (issue #117): this sidecar needs the gateway's
# per-run workspaces, NOT the fixture. Both services must mount the SAME named
# volume at the SAME container path, because EXECUTOR_RUNNER_WORKSPACE and the
# gateway's SCOPEWATCH_RUN_WORKSPACES_DIR are the two halves of one path
# contract across a container boundary. Change one without the other and every
# remote dispatch fails closed with 500 "run workspace unavailable".

services:
  executor-runner:
    build:
      # Repo root, not ./executor-runner: the sidecar imports two shared
      # modules from backend/scopewatch — the Docker job module (#106), so the
      # flag list, helper code, and copy-back walk cannot drift from the
      # gateway's, and the pre-dispatch gate (#105), so the approval and
      # outcome rules exist once.
      context: ..
      dockerfile: deploy/executor-runner/Dockerfile
    image: scopewatch/executor-runner:latest
    restart: unless-stopped
    # Internal-only: reachable by the gateway, not by the public internet.
    # Its own `internal: true` network, NOT the gateway's `internal` one
    # (issue #202): redeclaring `internal` as internal here removed the
    # gateway's HTTPS egress to the model provider and made every live audit
    # fail closed to HOLD. `deploy/compose.yaml` attaches the gateway to this
    # same network, so remote dispatch still reaches the runner.
    networks:
      - executor-runner
    environment:
      EXECUTOR_RUNNER_HOST: "0.0.0.0"
      EXECUTOR_RUNNER_PORT: "8091"
      # MUST equal the gateway's SCOPEWATCH_RUN_WORKSPACES_DIR (#117). The
      # gateway announces `run_workspace` as a bare per-run directory name
      # under its run-workspaces root; this runner resolves that key here.
      # Pointing this at the fixture volume instead (the old value,
      # /workspace) makes every remote dispatch fail closed with 500, because
      # no run's workspace exists under the fixture.
      # It is the ONLY workspace this service uses: it is not a path into the
      # repo, the home directory, or the scenario fixture.
      EXECUTOR_RUNNER_WORKSPACE: /runs
      EXECUTOR_RUNNER_TOKEN: ${EXECUTOR_RUNNER_TOKEN:?EXECUTOR_RUNNER_TOKEN is required}
      EXECUTOR_RUNNER_SIGNING_KEY: ${EXECUTOR_RUNNER_SIGNING_KEY:?EXECUTOR_RUNNER_SIGNING_KEY is required}
    volumes:
      # THE socket mount. No other service may add one.
      - /var/run/docker.sock:/var/run/docker.sock
      # The SAME named volume the gateway mounts at /runs (#117). This is what
      # makes the remote backend reachable at all: the runner is a different
      # container, so a path is only shared through a shared mount.
      # The fixture volume is deliberately NOT mounted here. This container
      # holds the Docker socket and runs as root; giving it write access to the
      # pristine scenario baseline buys nothing and risks exactly what #117
      # exists to prevent.
      - scopewatch-run-workspaces:/runs
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

networks:
  # This fragment's own egress-less network, shared with the gateway only.
  # `deploy/compose.yaml` declares it too and attaches its gateway service to
  # it, so merging the two files puts both services here; the merged value is
  # `internal: true`, which the gateway's provider-facing `internal` network
  # must never become (issue #202).
  executor-runner:
    driver: bridge
    internal: true

volumes:
  # MUST be the same host volume as deploy/compose.yaml's, or the two services
  # resolve `run_workspace` keys against different directories. Declared in
  # both fragments so either can be merged on its own; identical `name:` values
  # mean both resolve to one volume rather than two. The name is project-scoped
  # (issue #201) so a second project on the same host gets its own copy instead
  # of sharing this one.
  scopewatch-run-workspaces:
    name: ${COMPOSE_PROJECT_NAME:-scopewatch-demo}-run-workspaces
