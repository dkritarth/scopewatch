# Provider profiles for Scopewatch agent and auditor models.
#
# Single source of model IDs: core code never hard-codes a model ID.
# Use `get_mock_model_name()` / profile.model instead of string literals.
# See docs/agents/provider-profiles.md for selection, keys, and reasoning fields.
#
# Selection (independent per role, may differ simultaneously):
#   SCOPEWATCH_AGENT_PROFILE   (default: "mock")  -> agent loop model
#   SCOPEWATCH_AUDITOR_PROFILE (default: "mock")  -> reasoning auditor model
#   SCOPEWATCH_PROVIDERS_CONFIG                -> override path to this file (tests only)
#
# API keys are read ONLY from the environment variable named by `api_key_env`.
# Never commit real API keys or credentials to this file. `.env.example`
# lists SCOPEWATCH_AGENT_PROFILE, SCOPEWATCH_AUDITOR_PROFILE,
# OPENROUTER_API_KEY, and NEBIUS_API_KEY with empty values.
#
# Reasoning extraction: the client checks provider-specific response fields
# (e.g. reasoning_content, reasoning, reasoning_details) and sets provenance
# to PROVIDER_EXPOSED_TRACE only when a provider field supplied raw reasoning.
# Absent reasoning -> UNAVAILABLE. Never synthesized from `content`.
# Retries: bounded exponential backoff on 429/5xx only (never on 400).
# Errors are sanitized: no provider body or secret ever crosses into messages.

# Offline deterministic profile for tests and CI. No network, no key.
# `model` here is the single source for mock labels; code resolves it via
# get_mock_model_name() so "no model ID in code" holds.
[profiles.mock]
name = "mock"
model = "mock-rules-auditor"
base_url = "mock://localhost"
timeout_s = 30.0
max_retries = 0

# Development profile via OpenRouter (OpenAI-compatible). Needs OPENROUTER_API_KEY.
# Verified live 2026-10-03: 20 calls, 0 non-200, requested == served model id.
# CI uses mock only.
[profiles.openrouter-dev]
name = "openrouter-dev"
model = "nvidia/nemotron-3.5-lightning"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_s = 60.0
max_retries = 3
# Measured 2026-10-03, 20 isolated tool-calling turns: p50 11.5 s, p95 14.4 s,
# max 14.6 s, plus one ~39 s turn observed mid-run. Sizing hint for the agent
# wall-clock budget (issue #149): the loop warns when the budget buys fewer
# than 4 turns at this cost. A measured sample, not a guarantee.
agent_turn_plan_s = 14.4

# How to request reasoning from this provider (forwarded as extra request params).
# Observed 2026-10-03: this provider returns the trace in message.reasoning
# (message.reasoning_details is also present; reasoning_content is not), by
# default without include_reasoning, and including on tool-call turns where
# content is null and finish_reason is tool_calls.
[profiles.openrouter-dev.reasoning]
effort = "high"

# The auditor needs a short JSON verdict inside a 256-token cap. With reasoning
# on, the model spends the cap thinking and returns no JSON, so every audit fails
# closed to HOLD. Measured 2026-10-03 on nvidia/nemotron-3.5-lightning: with
# reasoning on, 2 of 4 calls ended finish_reason=length with all 256 completion
# tokens billed as reasoning; with reasoning disabled, 4 of 4 returned valid JSON
# with 0 reasoning tokens at p50 0.46 s. Agent calls keep the effort above (#128).
#
# Known residual live failure mode (not a config problem): with reasoning off the
# verdict JSON parses, but an excerpt in flagged_excerpts is sometimes not an
# exact substring of the bounded trace, and grounding validation then fails
# closed to HOLD with UNGROUNDED_EXCERPT. Measured 1 of 13 on the dev split;
# 0 PARSE_ERROR. See docs/spikes/2026-10-nemotron-provider-verification.md.
[profiles.openrouter-dev.auditor_body.reasoning]
enabled = false

# Demo profile via Nebius Token Factory (OpenAI-compatible). Needs NEBIUS_API_KEY.
# Verified live 2026-10-03 (#101): a Token Factory key authenticates, GET /v1/models
# returns 200 with the full catalogue, and a 48-case held-out auditor run completed
# (79.2% accuracy, FNR 8.33%, FHR 0.00%, failure 14.58%; docs/evaluation.md).
# The earlier "unverified, HTTP 401" note was a wrong credential type, not a code
# or endpoint fault: the key then in .env was a Nebius AI Cloud service-account key
# (401 on Token Factory and AI Studio, 403 on AI Cloud = authenticated, no
# permission). See docs/spikes/2026-10-nemotron-provider-verification.md section 4.
[profiles.nebius-demo]
name = "nebius-demo"
model = "nvidia/Nemotron-3_5-Lightning"
base_url = "https://api.tokenfactory.nebius.com/v1"
api_key_env = "NEBIUS_API_KEY"
timeout_s = 60.0
max_retries = 3

# The auditor requires a short JSON verdict, not hidden chain-of-thought.
# Measured 2026-10-01 and re-measured 2026-10-03: with thinking on, the 256-token
# cap is consumed before any JSON is emitted; with it off, the same prompt returns
# valid JSON with 0 reasoning tokens. This is also the whole latency story here:
# p50 619 ms on the held-out run.
#
# Known limit, and it is not a config problem: on Nebius, message.reasoning and
# message.reasoning_content are both present and None, with the thinking written
# into `content` instead. The gateway therefore records reasoning provenance as
# UNAVAILABLE for this profile (ADR-0001 decision 5: text in `content` is not a
# provider-exposed trace), and with no trace text the auditor is not attempted at
# all -- so a nebius-demo run shows ALLOW where openrouter-dev shows HOLD. See
# docs/evaluation.md, "Provider profiles: what each one exposes", and issue #214.
[profiles.nebius-demo.auditor_body.chat_template_kwargs]
enable_thinking = false
